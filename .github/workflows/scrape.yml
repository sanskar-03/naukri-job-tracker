name: Naukri Scraper

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Job keyword
        required: true
        default: Python Developer
      location:
        description: Location
        required: true
        default: Chennai
      pages:
        description: Pages (1-5)
        required: true
        default: '1'
  schedule:
    - cron: '30 3 * * *'

concurrency:
  group: naukri-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEFAULT_KEYWORD: ${{ vars.DEFAULT_KEYWORD }}
      DEFAULT_LOCATION: ${{ vars.DEFAULT_LOCATION }}
      DEFAULT_PAGES: ${{ vars.DEFAULT_PAGES }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium

      - name: Select search inputs
        id: inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "keyword=${{ inputs.keyword }}" >> "$GITHUB_OUTPUT"
            echo "location=${{ inputs.location }}" >> "$GITHUB_OUTPUT"
            echo "pages=${{ inputs.pages }}" >> "$GITHUB_OUTPUT"
          else
            echo "keyword=${DEFAULT_KEYWORD:-Python Developer}" >> "$GITHUB_OUTPUT"
            echo "location=${DEFAULT_LOCATION:-Chennai}" >> "$GITHUB_OUTPUT"
            echo "pages=${DEFAULT_PAGES:-1}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright scraper
        env:
          HEADLESS: '1'
        run: |
          python scraper/naukri_scraper.py \
            --keyword "${{ steps.inputs.outputs.keyword }}" \
            --location "${{ steps.inputs.outputs.location }}" \
            --pages "${{ steps.inputs.outputs.pages }}" \
            --excel data/naukri_jobs.xlsx

      - name: Show changed files
        run: git status --short

      - name: Commit updated Excel history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/naukri_jobs.xlsx
          if git diff --cached --quiet; then
            echo "No new Excel data to commit."
          else
            git commit -m "Update Naukri job history"
            git push
          fi
